# Buildspec for atom-logistic frontend (Vite + React)
# Env vars from Terraform CodeBuild: VITE_API_URL, VITE_COGNITO_USER_POOL_ID, VITE_COGNITO_CLIENT_ID,
#                                    S3_BUCKET, CLOUDFRONT_ID, BUILD_OUTPUT_PATH
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend && npm ci
  build:
    commands:
      - cd frontend
      - |
        [ -n "$VITE_API_URL" ] && export VITE_API_URL
        [ -n "$VITE_COGNITO_USER_POOL_ID" ] && export VITE_COGNITO_USER_POOL_ID
        [ -n "$VITE_COGNITO_CLIENT_ID" ] && export VITE_COGNITO_CLIENT_ID
      - npm run build
  post_build:
    commands:
      - echo "Deploying to S3..."
      - aws s3 sync frontend/${BUILD_OUTPUT_PATH:-dist}/ s3://$S3_BUCKET/ --delete
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"

artifacts:
  files:
    - '**/*'

cache:
  paths:
    - frontend/node_modules/**/*
